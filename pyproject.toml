[project]
name = "revise-langraph"
version = "0.1.0"
description = "Hands-on scenarios for learning LangGraph"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.18",
    "langchain-anthropic>=1.7.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "langgraph-cli[inmem]>=0.4.31",
]
